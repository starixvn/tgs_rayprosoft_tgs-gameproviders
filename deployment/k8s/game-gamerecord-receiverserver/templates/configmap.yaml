apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-kickplayer-receiverserver.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        },
        "TgsLog": {
          "LogLevel": {
            "Default": "None",
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "None",
            "TGS": "Information"
          }
        }
      },
      "AllowedHosts": "*",
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}"
      },
      "MongoDBConnectionString": {
        "GameProvider": "{{ .Values.connectionStrings.mongo }}"
      },
      "RedisConnectionString": {
        "Default": "{{ .Values.connectionStrings.redis }}"
      },
      "RabbitMQ": {
        "RabbitMQUrl": "{{ .Values.rabbit.url }}",
        "UserName": "{{ .Values.rabbit.user }}",
        "Password": "{{ .Values.rabbit.password }}",
        "VirtualHost": "{{ .Values.rabbit.vhost  }}"
      },
      "NatsMQ": {
        "Url": "{{ .Values.nats.urls }}"
      },
      "TCGFtpApi": {
        "Url": "http://game-tcg-ftp"
      }
    }
