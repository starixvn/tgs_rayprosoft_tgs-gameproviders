apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameproviders.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ForwardedHeaders": {
        "ForwardLimit": 2,
        "KnownProxies": [
          "192.168.50.1",
          "220.132.206.70",
          "211.24.72.160",
          "18.167.169.96"
        ]
      },
      "AllowedHosts": "*",
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}",
        "NatsMQ": "{{ .Values.nats.urls }}"
      }
    }
