apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameproviders.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Warning",
          "Microsoft.AspNetCore.HttpLogging.HttpLoggingMiddleware": "Information"
        }
      },
      "ConnectionStrings": {
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}",
        "NatsMQ": "{{ .Values.nats.urls }}"
      },
      "GameProviders": {
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver",
        "GameInterfaceAwcServiceBaseUrl":"http://game-gameinterface-awc-service:9090",
        "GameRoundsServiceBaseUrl":"http://game-gamerounds"
      },
    }
