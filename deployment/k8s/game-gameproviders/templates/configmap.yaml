apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameproviders.fullname" . }}
  labels:
    {{- include "game-gameproviders.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameProviders": {
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver",
        "GameInterfaceAwcServiceBaseUrl":"http://game-gameinterface-awc-service:9090",
        "GameInterfaceJiliServiceBaseUrl":"http://game-gameinterface-jili-service:9090",
        "GameInterfaceWMCasinoServiceBaseUrl":"http://game-gameinterface-wmcasino-service:9090",
        "GameRoundsServiceBaseUrl":"http://game-gamerounds"
      }
    }
